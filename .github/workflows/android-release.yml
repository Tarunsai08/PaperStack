name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    # Daily "[content]" commits reach the app through content sync, so they skip the APK build.
    if: ${{ !contains(github.event.head_commit.message || '', '[content]') }}
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Validate content and build index
        run: python pipeline/build_index.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Test and build web app
        working-directory: app
        env:
          VITE_CONTENT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/content
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the legacy "tools" package, which the
          # current SDK repository no longer has, so sdkmanager fails.
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > app/android/app/release.jks

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this is a DEBUG build. Each debug build is signed with a new key and cannot update the previous install. See README: Signing."
            ./gradlew assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          mkdir -p ../../out
          cp "$APK" ../../out/PaperStack-$VERSION_NAME.apk
          ls -la ../../out

      - name: Write release notes
        run: |
          {
            echo "## PaperStack $VERSION_NAME"
            echo
            echo "Download **PaperStack-$VERSION_NAME.apk** below on your Android phone and open it to install."
            echo
            if [ "$HAS_KEYSTORE" != "true" ]; then
              echo "> **Warning: debug build.** The signing secrets are not configured, so this APK is signed with a temporary key."
              echo "> It cannot install over a previous version; uninstall the old app first (your reading progress will be lost)."
              echo "> Add the keystore secrets described in the README to get updatable builds."
              echo
            fi
          } > out/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: PaperStack-${{ env.VERSION_NAME }}
          path: out/*.apk
          retention-days: 14

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: PaperStack ${{ env.VERSION_NAME }}
          body_path: out/notes.md
          files: out/*.apk
          generate_release_notes: true
          make_latest: true
