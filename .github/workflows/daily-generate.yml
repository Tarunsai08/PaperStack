name: Daily Generate

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:
    inputs:
      count:
        description: "Max articles per subject (blank = daily_mix from pipeline/config.yaml)"
        required: false
        default: ""
      subject:
        description: "Only this subject (dsa, cp, famous-algos, system-design, ml)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
    steps:
      - name: Check for API keys
        id: keys
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "No GEMINI_API_KEY or GROQ_API_KEY secret is set, so there is nothing to generate. Exiting successfully."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.keys.outputs.enabled == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Restore LLM and PDF cache
        if: steps.keys.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Generate articles
        if: steps.keys.outputs.enabled == 'true'
        run: |
          pip install -r pipeline/requirements.txt
          ARGS=()
          if [ -n "${{ github.event.inputs.count }}" ]; then ARGS+=(--count "${{ github.event.inputs.count }}"); fi
          if [ -n "${{ github.event.inputs.subject }}" ]; then ARGS+=(--subject "${{ github.event.inputs.subject }}"); fi
          # Curriculum queue + draft/critic/revise + quality gate (validator, C++ compile, score).
          python pipeline/curriculum_generate.py "${ARGS[@]}"
          python pipeline/build_index.py
          python tools/check_cpp.py
          python tools/progress.py

      - name: Upload run log
        if: steps.keys.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and push new articles
        id: commit
        if: steps.keys.outputs.enabled == 'true'
        run: |
          if [ -z "$(git status --porcelain content pipeline/drafts PROGRESS.md)" ]; then
            echo "No new articles today."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "paperstack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content PROGRESS.md
          if [ -d pipeline/drafts ]; then git add pipeline/drafts; fi
          NEW=$(git diff --cached --name-only --diff-filter=A -- 'content/*.md' 'content/**/*.md' | wc -l | tr -d ' ')
          REVIEW=$(git diff --cached --name-only --diff-filter=A -- pipeline/drafts | wc -l | tr -d ' ')
          git commit -m "[content] $NEW new article(s), $REVIEW draft(s) for review, $(date -u +%Y-%m-%d)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not start other workflows, so start the web deploy explicitly.
      # The Android app then picks up the new articles through content sync (no new APK needed).
      - name: Redeploy web content
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref "${{ github.ref_name }}"
